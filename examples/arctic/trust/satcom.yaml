apiVersion: continuity.io/v1
kind: DependencyTrust
metadata:
  name: arctic-satcom-trust
  namespace: arctic-operations
spec:
  dependency_ref: satcom/iridium
  dimensions:
    physical_availability: 0.95
    cyber_integrity: 0.85
    legal_availability: 1.0
    commercial_availability: 0.90
    insurance_availability: 0.90
    communications_integrity: 0.92
    navigation_integrity: 0.95
    operator_confidence: 0.90
    information_confidence: 0.90
  strategy:
    aggregation: minimum
  provenance:
    minimum_independent_sources: 2
