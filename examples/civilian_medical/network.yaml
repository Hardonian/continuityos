apiVersion: continuity.io/v1
kind: SupplyNetwork
metadata:
  name: regional-medical-supply
  namespace: healthcare-continuity
  labels:
    sector: public-health
    criticality: tier-1
spec:
  objectives:
    minimum_continuity: 0.98
    maximum_critical_shortage_days: 3
    maximum_recovery_days: 14
  redundancy:
    minimum_routes: 2
    minimum_ports: 2
    minimum_satcom_providers: 2
    minimum_navigation_sources: 2
    minimum_observation_sources: 2
  inventory:
    fuel_reserve_days: 30
    medical_reserve_days: 45
  dependency_rules:
    prohibit_single_state_service_dependency: true
    require_independent_navigation_sources: true
    require_independent_observation_sources: true
  failure_tolerance:
    routes_unavailable: 1
    ports_unavailable: 1
    communication_providers_unavailable: 1
    navigation_sources_untrusted: 1
  recovery:
    require_inventory_recovery_model: true
    require_carrier_return_model: true
    require_port_backlog_model: true
