apiVersion: continuity.io/v1
kind: ContinuityPolicy
metadata:
  name: regional-medical-continuity-policy
  namespace: healthcare-continuity
spec:
  rules:
    - rule_id: MED-RES-001
      description: Critical ICU pharmaceuticals and vaccine reserves must meet or exceed 30 days
      assertion:
        minimum_reserve_days: 30
    - rule_id: MED-COLD-002
      description: Cold-chain distribution integrity must be maintained across all transit modes
      assertion:
        minimum_trust_score: 0.90
    - rule_id: MED-RTE-003
      description: Regional hospitals must have at least 2 independent supply routes (maritime port + inland air freight)
      assertion:
        minimum_independent_routes: 2
    - rule_id: MED-CONT-004
      description: Overall medical network continuity must remain >= 98%
      assertion:
        minimum_continuity: 0.98
