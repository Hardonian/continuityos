name: Deploy to Vercel (continuityos-ui)

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/deploy-continuityos-ui.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy static UI to Vercel
        working-directory: ui
        run: |
          npm i -g vercel
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" --scope shardie-githubs-projects --name continuityos-ui .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
