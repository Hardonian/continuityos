name: Bug Report
description: Create a report to help us improve ContinuityOS
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: ContinuityOS Version
      description: What version of ContinuityOS are you running? (Run `continuity version`)
      placeholder: v1.0.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Commands or declarative manifests that reproduce the issue.
      placeholder: |
        1. Run 'continuity plan ...'
        2. Encounter error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log / Terminal Output
      render: shell
