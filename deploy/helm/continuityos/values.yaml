replicaCount: 1

image:
  repository: continuityos-reference
  pullPolicy: IfNotPresent
  tag: "0.1.0"

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 2000m
    memory: 2048Mi
  requests:
    cpu: 500m
    memory: 512Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

env:
  CONTINUITYOS_ENVIRONMENT: production
  CONTINUITYOS_OUTBOUND_HTTP_ENABLED: "false"

secrets:
  operatorWebhookSecret: ""
  apiKey: ""
  evidencePrivateKey: ""
  evidencePublicKey: ""
