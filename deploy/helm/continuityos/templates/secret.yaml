apiVersion: v1
kind: Secret
metadata:
  name: {{ include "continuityos.fullname" . }}-secrets
type: Opaque
stringData:
  operatorWebhookSecret: {{ .Values.secrets.operatorWebhookSecret | quote }}
  apiKey: {{ .Values.secrets.apiKey | quote }}
  evidence-private.pem: {{ .Values.secrets.evidencePrivateKey | quote }}
  evidence-public.pem: {{ .Values.secrets.evidencePublicKey | quote }}
